name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Type check (mypy strict)
        run: uv run mypy
      - name: Architecture rules (import-linter)
        working-directory: apps/api
        run: uv run lint-imports
      - name: Plans are well formed (plans-lint)
        run: uv run just plans-lint
      - name: Generated agent/skill adapters match their source (harness-check)
        run: uv run just harness-check
      - name: Unit tests (tooling, plan tooling, API)
        run: uv run pytest --ignore=scripts/harness
      - name: Guard hooks and adapter generator (test-harness)
        run: uv run just test-harness

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Check every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run scripts/commits.py --range "$BASE_SHA..$HEAD_SHA"

  api-integration:
    name: API integration (PostgreSQL + Valkey)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same image as infra/docker/compose.yaml (postgres:18-alpine)
        image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral
          POSTGRES_DB: fragancia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d fragancia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        # Same image as infra/docker/compose.yaml (valkey/valkey:9.0-alpine)
        image: valkey/valkey@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      storage:
        # Same image as infra/docker/compose.yaml (RustFS); the photo tests need real S3.
        image: rustfs/rustfs@sha256:0b3d45bbbc9eb73433ac48e4eb8374a460061ea1e4e952e25a3ef79796733617
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-ephemeral
        ports:
          - 9100:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        # Same image as infra/docker/compose.yaml (Mailpit); the identity email tests read it.
        image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 1026:1025
          - 8026:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci-ephemeral@localhost:5432/fragancia_test
      DATABASE_URL_TEST: postgresql+psycopg://ci:ci-ephemeral@localhost:5432/fragancia_test
      VALKEY_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://127.0.0.1:9100
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-ephemeral
      S3_BUCKET: fragancia-media
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:9100/fragancia-media
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1026"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Create the media bucket (same helpers as bootstrap)
        working-directory: scripts
        run: >-
          uv run python -c "import os, boto3;
          from infra import ensure_bucket, ensure_public_read;
          s3 = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT_URL'],
          aws_access_key_id=os.environ['S3_ACCESS_KEY'],
          aws_secret_access_key=os.environ['S3_SECRET_KEY'], region_name='us-east-1');
          ensure_bucket(s3, os.environ['S3_BUCKET']);
          ensure_public_read(s3, os.environ['S3_BUCKET'], 'perfumes/')"
      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic -x test=true upgrade head
      - name: Table definitions match the migrations
        working-directory: apps/api
        run: uv run alembic -x test=true check
      - name: Downgrade and upgrade again (migrations are reversible)
        working-directory: apps/api
        run: |
          uv run alembic -x test=true downgrade base
          uv run alembic -x test=true upgrade head
      - name: Integration tests
        run: uv run pytest apps/api/tests -m integration

  docker:
    name: Docker (${{ matrix.target }})
    needs: [quality, api-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, migrator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.target }}

  infra:
    name: Local environment (bootstrap twice + smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Bootstrap (first run creates everything)
        run: uv run just bootstrap
      - name: Bootstrap again (must be idempotent and keep apps/api/.env)
        run: |
          before=$(sha256sum apps/api/.env)
          uv run just bootstrap | tee second-run.log
          [ "$before" = "$(sha256sum apps/api/.env)" ]
          grep -q '= apps/api/.env already exists' second-run.log
          grep -q '= fragancia_test already exists' second-run.log
          grep -q '= bucket fragancia-media already exists' second-run.log
      - name: Smoke test services
        run: |
          compose="docker compose -f infra/docker/compose.yaml"
          $compose exec -T postgres psql -U fragancia -d fragancia -tAc 'select 1' | grep -qx 1
          $compose exec -T postgres psql -U fragancia -d fragancia_test -tAc 'select 1' | grep -qx 1
          $compose exec -T valkey valkey-cli ping | grep -qx PONG
          uv run python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9100', aws_access_key_id='fragancia', aws_secret_access_key='fragancia-dev', region_name='us-east-1').head_bucket(Bucket='fragancia-media')"
          curl -fsS http://127.0.0.1:8026/api/v1/info > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker/compose.yaml logs --no-color
      - name: Stop services
        if: always()
        run: uv run just down
