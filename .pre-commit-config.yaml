# Git hooks. Installed by `just bootstrap`; run on everything with `just lint`.
# External hook repos are frozen to a commit SHA (`pre-commit autoupdate --freeze`).
# Ruff runs from the uv environment so the version is the one locked in uv.lock.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 357f7eec6dec49bf7693dc0dbec30212226d5492  # frozen: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: commit-message
        name: commit message convention
        entry: uv run scripts/commits.py --file
        language: system
        stages: [commit-msg]
